plugins {
	id 'fabric-loom' version '1.16.3'
	id 'maven-publish'
}

// ---------------------------------------------------------------------------
// Minecraft 1.20.1 Fabric target.
//
// Version parameters (all verified, not copied from the 1.21.9 target):
//   * minecraft    1.20.1        -- the target
//   * fabric-loader 0.16.10      -- released for 1.20.1; see maven.fabricmc.net metadata
//   * fabric-api   0.92.8+1.20.1 -- the 1.20.1 line of Fabric API
//   * java         17            -- 1.20.1 ships for Java 17 (class file 61)
//   * fabric-loom  1.16.3       -- Loom is NOT tied to the Minecraft version; it is tied to the
//                                   Gradle/JDK it runs under. Loom declares its requirement in the
//                                   `org.gradle.plugin.api-version` attribute of its Gradle module
//                                   metadata, and Gradle refuses a plugin whose attribute is above
//                                   the running build. Verified values:
//                                       loom 1.15.5 -> plugin-api 9.2.0
//                                       loom 1.16.1 -> plugin-api 9.4.0
//                                       loom 1.16.3 -> plugin-api 9.4.0   <-- used here
//                                       loom 1.17.20/1.17.21 -> plugin-api 9.5.0
//                                   This repository's wrapper is Gradle 9.4.0, so 1.17.20 (what the
//                                   1.21.9 target uses) is refused with "No matching variant ...
//                                   plugin.api-version 9.4.0 vs 9.5.0". 1.16.3 is the newest Loom
//                                   that accepts a 9.4.0 consumer, needs Java 21 (satisfied), and is
//                                   already in the local Gradle cache.
//                                   Loom 1.16.x supports the whole 1.14+ Minecraft range, including
//                                   1.20.1. (The pre-multiversion attempt at this target pinned
//                                   `net.fabricmc.fabric-loom-remap 1.14-SNAPSHOT`, a snapshot that
//                                   no longer resolves; do not go back to that.)
// ---------------------------------------------------------------------------
def minecraftVersion = '1.20.1'
def loaderVersion = '0.16.10'
def fabricVersion = '0.92.8+1.20.1'
def distantHorizonsApiVersion = '6.1.0'
def javaVersion = 17
def distantHorizonsRuntimePath = providers.gradleProperty('mc1201_distant_horizons_runtime_path').orNull

base {
	archivesName = "${rootProject.archives_base_name}-${minecraftVersion}-${rootProject.mod_version}"
}

configurations {
	bundledLibrary
}

tasks.withType(AbstractArchiveTask).configureEach {
	archiveVersion.set('')
}

repositories {
	mavenCentral()
	maven {
		url = 'https://api.modrinth.com/maven/'
		content {
			includeGroup 'maven.modrinth'
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		tellus {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Same layout contract as the 1.21.9 target: the root source sets hold code and resources
// shared by every Minecraft target, the module source sets hold the version-specific ones.
sourceSets {
	main {
		java {
			setSrcDirs([rootProject.file('src/main/java'), project.file('src/main/java')])
		}
		resources {
			setSrcDirs([rootProject.file('src/main/resources'), project.file('src/main/resources')])
		}
	}
	client {
		java.setSrcDirs([project.file('src/client/java')])
		resources.setSrcDirs([project.file('src/client/resources')])
	}
	test {
		java.setSrcDirs([rootProject.file('src/test/java'), project.file('src/test/java')])
		resources.setSrcDirs([rootProject.file('src/test/resources'), project.file('src/test/resources')])
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraftVersion}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricVersion}"

	bundledLibrary 'org.tukaani:xz:1.10'
	implementation 'org.tukaani:xz:1.10'

	// Vector tile decoding for the OpenStreetMap overlay sources. 23.2.0 is the 1.20.1-era
	// release; 24.x moved its baseline forward and is not guaranteed loadable on Java 17.
	implementation 'io.github.sebasbaumh:mapbox-vector-tile-java:23.2.0'
	include 'io.github.sebasbaumh:mapbox-vector-tile-java:23.2.0'
	// mapbox-vector-tile-java's protobuf runtime. The sources do not import it directly; it is
	// pulled in because the tile reader needs it on the classpath at runtime.
	implementation 'com.google.protobuf:protobuf-java:3.23.4'
	include 'com.google.protobuf:protobuf-java:3.23.4'

	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
	testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'

	// Distant Horizons is an optional soft dependency: compileOnly so the types resolve here,
	// never shipped.
	compileOnly "maven.modrinth:DistantHorizonsApi:${distantHorizonsApiVersion}"
	// Mod Menu is the mod's configuration entry point, so TellusModMenu has to compile against it.
	// 7.2.2 is the newest release of the 1.20.1 line (confirmed against the Modrinth API:
	// /v2/project/mOgUt4GM/version?game_versions=["1.20.1"]&loaders=["fabric"] -> latest 7.2.2).
	// modImplementation so a dev-env runClient has it, like the 1.21.9 target's modCompileOnly.
	modCompileOnly 'maven.modrinth:modmenu:7.2.2'
	if (distantHorizonsRuntimePath) {
		runtimeOnly files(distantHorizonsRuntimePath)
	}
}

processResources {
	inputs.property 'version', project.version

	filesMatching('fabric.mod.json') {
		expand version: inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = javaVersion
	// javac stops at 100 errors by default, which hides the tail of a porting sweep.
	options.compilerArgs += ['-Xmaxerrs', '4000']
}

tasks.named('test').configure {
	useJUnitPlatform()
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(javaVersion)
	}

	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(javaVersion)
	targetCompatibility = JavaVersion.toVersion(javaVersion)
}

jar {
	inputs.property 'archivesName', project.base.archivesName

	from({
		configurations.bundledLibrary.collect { zipTree(it) }
	}) {
		exclude 'META-INF/MANIFEST.MF'
	}

	from(rootProject.file('LICENSE')) {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			artifactId = project.base.archivesName.get()
			from components.java
		}
	}

	repositories {
	}
}
