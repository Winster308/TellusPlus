pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Tellus'

// ---------------------------------------------------------------------------
// Target selection
//
// Each Minecraft version needs a different Fabric Loom, and Loom versions are not
// interchangeable: mc1219 uses fabric-loom 1.17.20, the 26.x line uses
// fabric-loom 1.16.x, and an older target may need something else again.
//
// If every target were included unconditionally, Gradle would resolve all of their
// plugins during configuration, and one unreachable or conflicting Loom would fail
// the build for *every* target -- including the one being built. That is exactly
// what happened here before: the three older targets were commented out with a note
// saying they "each pin a different Loom version", leaving only mc1219 buildable.
//
// So targets are opt-in:
//
//   ./gradlew build                 -> builds mc1219 only (the default)
//   ./gradlew -Ptarget=mc1201 build -> builds mc1201 only
//   ./gradlew -Ptarget=all build    -> builds every target that has a build.gradle
//
// A target directory is only included when it actually contains a build.gradle, so a
// half-created directory cannot break the build for the others.
// ---------------------------------------------------------------------------

def defaultTarget = 'mc1219'
def knownTargets = ['mc1201', 'mc1211', 'mc1219', 'mc12111', 'mc262']

def requested = (gradle.startParameter.projectProperties['target'] ?: defaultTarget)
	.toString().split(',').collect { it.trim() }
if (requested.contains('all')) {
	requested = knownTargets
}

def included = []
def skipped = []
requested.each { t ->
	if (!knownTargets.contains(t)) {
		skipped << "$t (unknown target)"
		return
	}
	if (!file("$t/build.gradle").exists()) {
		skipped << "$t (no build.gradle yet)"
		return
	}
	include(t)
	included << t
}

if (!included.isEmpty()) {
	logger.lifecycle("Tellus: building target(s) ${included.join(', ')}")
}
if (!skipped.isEmpty()) {
	logger.lifecycle("Tellus: skipped ${skipped.join(', ')}")
}

dependencyResolutionManagement {
	repositories {
		mavenCentral()
	}
}
